# PixiView の Kotlin / Compose 静的解析設定
# 前提バージョン: detekt 2.0.0-alpha.6 / detekt-rules-ktlint-wrapper / io.nlopez.compose.rules:detekt:0.6.8
# 実行方法と手動レビューの対象は README-JA.md の「静的解析」を参照

complexity:
  active: true
  # 論理演算子2つ以上（条件3つ以上）の条件式を検出する。Boolean 変数への切り出し方は AGENTS.md を参照
  ComplexCondition:
    active: true
    allowedConditions: 2
  LongMethod:
    active: true
    # Composable は UI 構造の記述で行数が伸びるため除外
    ignoreAnnotated:
      - 'Composable'
  LongParameterList:
    active: true
    ignoreDefaultParameters: true
    # Composable は引数が多くなる設計のため除外
    ignoreAnnotated:
      - 'Composable'
  TooManyFunctions:
    active: true
    allowedFunctionsPerInterface: 15
    allowedFunctionsPerClass: 15
    ignoreOverridden: true
    # テストケースの数は production class の責務の数として扱わない。
    excludes:
      - '**/commonTest/**'
      - '**/androidHostTest/**'
    # 小さな private Composable へ分割するスタイルと衝突するため private は数えない
    ignorePrivate: true

coroutines:
  active: true

empty-blocks:
  active: true

exceptions:
  active: true
  TooGenericExceptionCaught:
    # 認証系ライブラリが Throwable などを投げるため無効化。導入プロジェクトで検出量を確認の上、有効化を検討する
    active: false

naming:
  active: true
  FunctionNaming:
    ignoreAnnotated:
      - 'Composable'
  MatchingDeclarationName:
    active: false
  PackageNaming:
    active: false
  TopLevelPropertyNaming:
    active: false
  # 一文字変数を検出する（`i` ではなく `index`）。命名の意味づけは AGENTS.md を参照
  VariableMinLength:
    active: true
    minimumVariableNameLength: 2

performance:
  active: true
  SpreadOperator:
    active: false

style:
  active: true
  MaxLineLength:
    active: false
  MagicNumber:
    active: false
  ReturnCount:
    # 早期 return を多用するスタイルのため無効化
    active: false
  ThrowsCount:
    active: false
  LoopWithTooManyJumpStatements:
    active: false
  ForbiddenComment:
    # 開発時のコメントを削除する必要はないため無効化
    active: false
  DestructuringDeclarationWithTooManyEntries:
    # Compose の ConstraintLayout#createRefs などで用いるため無効化
    active: false
  # 空のコレクションは emptyList() などの empty 系で生成する
  UseEmptyCounterpart:
    active: true
  # プロパティ、メソッド、companion object の順序を強制する
  ClassOrdering:
    active: true
  # 複数行の for / while に中括弧を強制する
  MandatoryBracesLoops:
    active: true
  # メソッドチェーンは1行に2呼び出しまで。3呼び出し以上は改行する
  MaxChainedCallsOnSameLine:
    active: true
    maxChainedCalls: 2
  # UnusedPrivateFunction / UnusedPrivateProperty は型情報が必要なため、full モードのタスクでだけ実行される（README-JA.md の「静的解析」を参照）
  UnusedPrivateFunction:
    active: true
    # Compose の Preview 関数は呼び出されないため除外
    ignoreAnnotated:
      - 'Preview'
  UnusedPrivateProperty:
    active: true
    # Test でモックしているプロパティは除外
    ignoreAnnotated:
      - 'RelaxedMockK'
      - 'InjectMockKs'

comments:
  # UndocumentedPublicClass は Activity / Fragment / Dialog / ViewModel をクラス名で除外できないため使わない。
  # KDoc の規約（対象クラスと日本語での記述）は AGENTS.md で扱う
  active: false

potential-bugs:
  active: true
  UnsafeCallOnNullableType:
    # `!!` を許容している。導入プロジェクトで検出量を確認の上、有効化を検討する
    active: false

ktlint:
  active: true
  autoCorrect: true
  MaximumLineLength:
    active: false
  # 呼び出しの改行は引数の数・形で判断するため、行長による折り返しを無効化する
  ArgumentListWrapping:
    active: false
  ParameterListWrapping:
    active: false
  # デフォルト引数の有無による改行を判別できないため、関数定義の改行は手動レビューする。
  FunctionSignature:
    active: false
  ClassSignature:
    active: true
    forceMultilineWhenParameterCountGreaterOrEqualThan: '3'
    maxLineLength: -1
  BinaryExpressionWrapping:
    maxLineLength: -1
  FunctionLiteral:
    maxLineLength: -1
  NoWildcardImports:
    # style ルールセットの WildcardImport で検出するため、二重報告を避けて無効化
    active: false
  # 定義箇所での trailing comma を強制する
  TrailingCommaOnDeclarationSite:
    active: true
  # 呼び出し箇所での trailing comma を強制する
  TrailingCommaOnCallSite:
    active: true
  PackageName:
    active: false
  Filename:
    active: false

Compose:
  active: true
  # Composable に modifier 引数を必須にする
  ModifierMissing:
    active: true
    checkModifiersForVisibility: all
    ignoreAnnotated:
      - 'Preview'
  # modifier 引数のデフォルト値 `Modifier` を強制する
  ModifierWithoutDefault:
    active: true
  # 必須引数 → デフォルト引数（modifier が先頭）→ 末尾ラムダ の宣言順を強制する
  ComposableParamOrder:
    active: true
  # ラムダ引数名を現在形（onClick / onChange）に強制する
  ParameterNaming:
    active: true
    # Restricted は表示対象を修飾する形容詞であり、過去形のイベント名ではない。
    allowedLambdaParameterNames:
      - 'onClickHideRestricted'
  # Composable 引数の List / Map / Set を検出し、Immutable なコレクション型を強制する（opt-in のため明示有効化）
  UnstableCollections:
    active: true
  CompositionLocalAllowlist:
    # CompositionLocal の利用を許可リスト制にはしない
    active: false
