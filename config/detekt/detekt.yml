# 共通 detekt 設定テンプレート
# 前提バージョン: detekt 2.0.0-alpha.6 / detekt-rules-ktlint-wrapper / io.nlopez.compose.rules:detekt:0.6.8
# 導入手順と閾値の調整方針は Agents リポジトリの rules/lint/README.md を参照
# コメント中の「Kotlin 規約」は Agents リポジトリの rules/kotlin.md を指す。各プロジェクトでは AGENTS.md の管理ブロックとして注入される

complexity:
  active: true
  # 論理演算子2つ以上（条件3つ以上）の条件式を検出する。Boolean 変数への切り出し方は Kotlin 規約を参照
  ComplexCondition:
    active: true
    allowedConditions: 2
  LongMethod:
    active: true
    # Composable は UI 構造の記述で行数が伸びるため除外
    ignoreAnnotated:
      - 'Composable'
  LongParameterList:
    active: true
    ignoreDefaultParameters: true
    # Composable は引数が多くなる設計のため除外
    ignoreAnnotated:
      - 'Composable'
  TooManyFunctions:
    active: true
    # 小さな private Composable へ分割するスタイルと衝突するため private は数えない
    ignorePrivate: true
    # interface などが要求する override は、そのクラスが独自に増やした責務ではないため数えない
    ignoreOverridden: true
    # テストケースの数でテストクラスを分割させない。excludes は既定値を置き換えるため、
    # 既定の除外に KMP の独自 test source set（clientTest など）を拾う '**/src/*Test/**' を加える
    excludes:
      - '**/test/**'
      - '**/androidTest/**'
      - '**/commonTest/**'
      - '**/jvmTest/**'
      - '**/androidUnitTest/**'
      - '**/androidInstrumentedTest/**'
      - '**/jsTest/**'
      - '**/iosTest/**'
      - '**/src/*Test/**'

coroutines:
  active: true

empty-blocks:
  active: true

exceptions:
  active: true
  TooGenericExceptionCaught:
    # 認証系ライブラリが Throwable などを投げるため無効化。導入プロジェクトで検出量を確認の上、有効化を検討する
    active: false

naming:
  active: true
  FunctionNaming:
    ignoreAnnotated:
      - 'Composable'
  MatchingDeclarationName:
    active: false
  PackageNaming:
    active: false
  TopLevelPropertyNaming:
    active: false
  # 一文字変数を検出する（`i` ではなく `index`）。命名の意味づけは Kotlin 規約を参照
  VariableMinLength:
    active: true
    minimumVariableNameLength: 2

performance:
  active: true
  SpreadOperator:
    active: false

style:
  active: true
  MaxLineLength:
    active: false
  MagicNumber:
    active: false
  ReturnCount:
    # 早期 return を多用するスタイルのため無効化
    active: false
  ThrowsCount:
    active: false
  LoopWithTooManyJumpStatements:
    active: false
  ForbiddenComment:
    # 開発時のコメントを削除する必要はないため無効化
    active: false
  DestructuringDeclarationWithTooManyEntries:
    # Compose の ConstraintLayout#createRefs などで用いるため無効化
    active: false
  # 空のコレクションは emptyList() などの empty 系で生成する
  UseEmptyCounterpart:
    active: true
  # プロパティ、メソッド、companion object の順序を強制する
  ClassOrdering:
    active: true
  # 複数行の for / while に中括弧を強制する
  MandatoryBracesLoops:
    active: true
  # プロパティ参照もチェーンの数に含め（`points.first().crs` を3と数える）、「1行に関数呼び出し2つまで」の規約とずれるため無効化する。
  # メソッドチェーンの規約は Kotlin 規約で扱う
  MaxChainedCallsOnSameLine:
    active: false
  # UnusedPrivateFunction / UnusedPrivateProperty は型情報が必要なため、full モードのタスクでだけ実行される（rules/lint/README.md の「実行タスク」を参照）
  UnusedPrivateFunction:
    active: true
    # Compose の Preview 関数は呼び出されないため除外
    ignoreAnnotated:
      - 'Preview'
  UnusedPrivateProperty:
    active: true
    # Test でモックしているプロパティは除外
    ignoreAnnotated:
      - 'RelaxedMockK'
      - 'InjectMockKs'

comments:
  # UndocumentedPublicClass は Activity / Fragment / Dialog / ViewModel をクラス名で除外できないため使わない。
  # KDoc の規約（対象クラスと日本語での記述）は Kotlin 規約で扱う
  active: false

potential-bugs:
  active: true
  UnsafeCallOnNullableType:
    # `!!` を許容している。導入プロジェクトで検出量を確認の上、有効化を検討する
    active: false

ktlint:
  active: true
  autoCorrect: true
  MaximumLineLength:
    active: false
  # 改行は行長ではなく引数の数で判断する。wrapper は .editorconfig の max_line_length を読まないため、
  # 行長を使うルールごとに maxLineLength: -1 で行長による改行・1行化を止める
  BinaryExpressionWrapping:
    maxLineLength: -1
  ContextReceiverListWrapping:
    maxLineLength: -1
  ContextReceiverMapping:
    maxLineLength: -1
  FunctionExpressionBody:
    maxLineLength: -1
  FunctionLiteral:
    maxLineLength: -1
  FunctionReturnTypeSpacing:
    maxLineLength: -1
  ParameterListSpacing:
    maxLineLength: -1
  ParameterWrapping:
    maxLineLength: -1
  PropertyWrapping:
    maxLineLength: -1
  Wrapping:
    maxLineLength: -1
  # 引数の折り返しは行長ではなく引数の数で判断するため無効化し、FunctionSignature / ClassSignature で強制する
  ArgumentListWrapping:
    active: false
  ParameterListWrapping:
    active: false
  # 引数3つ以上の関数定義を複数行に強制する。引数2つまでの1行定義とデフォルト引数による改行は Kotlin 規約を参照
  FunctionSignature:
    active: true
    forceMultilineWhenParameterCountGreaterOrEqualThan: 3
    maxLineLength: -1
  # 引数3つ以上のコンストラクタを複数行に強制する
  ClassSignature:
    active: true
    forceMultilineWhenParameterCountGreaterOrEqualThan: '3'
    maxLineLength: -1
  NoWildcardImports:
    # style ルールセットの WildcardImport で検出するため、二重報告を避けて無効化
    active: false
  # 定義箇所での trailing comma を強制する
  TrailingCommaOnDeclarationSite:
    active: true
  # 呼び出し箇所での trailing comma を強制する
  TrailingCommaOnCallSite:
    active: true
  PackageName:
    active: false
  Filename:
    active: false

Compose:
  active: true
  # Composable に modifier 引数を必須にする。既定では public だけを検査するが、Kotlin 規約は internal / private も対象にするため全可視性を検査する
  ModifierMissing:
    active: true
    checkModifiersForVisibility: all
  # modifier 引数のデフォルト値 `Modifier` を強制する
  ModifierWithoutDefault:
    active: true
  # 必須引数 → デフォルト引数（modifier が先頭）→ 末尾ラムダ の宣言順を強制する
  ComposableParamOrder:
    active: true
  # ラムダ引数名を現在形（onClick / onChange）に強制する
  ParameterNaming:
    active: true
  # Composable 引数の List / Map / Set を検出し、Immutable なコレクション型を強制する（opt-in のため明示有効化）
  UnstableCollections:
    active: true
  CompositionLocalAllowlist:
    # CompositionLocal の利用を許可リスト制にはしない
    active: false
